name: CI Quality Gates

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with tmate debugging'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PLAYWRIGHT_BROWSERS_PATH: /opt/hostedtoolcache/browsers
  CI: true

jobs:
  # ============================================
  # JOB: Pre-flight Checks (Fast Fail)
  # ============================================
  preflight:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run_tests: ${{ steps.check.outputs.should_run_tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for skip label
        id: check
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-ci') }}" == "true" ]]; then
            echo "should_run_tests=false" >> $GITHUB_OUTPUT
          else
            echo "should_run_tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate package-lock.json
        run: |
          if ! npm ls >/dev/null 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json"
            exit 1
          fi

  # ============================================
  # JOB: Lint & Type Check
  # ============================================
  lint:
    name: 📝 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.should_run_tests == 'true'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: true

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript Check
        run: npx tsc --noEmit

  # ============================================
  # JOB: Unit & Component Tests with Coverage
  # ============================================
  test-unit:
    name: 🧪 Unit & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: needs.preflight.outputs.should_run_tests == 'true'
    
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: true

      - name: Run Vitest with Sharding
        run: npx vitest run --shard=${{ matrix.shard }}/4 --coverage
        
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/
          retention-days: 7
          include-hidden-files: true

  # ============================================
  # JOB: E2E Tests with Playwright
  # ============================================
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    if: needs.preflight.outputs.should_run_tests == 'true'
    
    strategy:
      matrix:
        shard: [1, 2, 3]
      fail-fast: false
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

      - name: Run Playwright E2E Tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
        
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Video Recordings
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB: Build & Bundle Analysis
  # ============================================
  build:
    name: 🏗️ Build & Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test-unit]
    if: needs.preflight.outputs.should_run_tests == 'true' && success()
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: true

      - name: Build Production Bundles
        run: npm run build

      - name: Analyze Bundle Size
        run: npm run analyze:treemap || true
        continue-on-error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

      - name: Check Bundle Size Budget
        run: |
          # Simple bundle size check (adjust thresholds as needed)
          MAX_SIZE=2000000  # 2MB in bytes
          ACTUAL_SIZE=$(du -sb dist/ | cut -f1)
          echo "Bundle size: $((ACTUAL_SIZE / 1024)) KB"
          if [ "$ACTUAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::warning::Bundle size exceeds $((MAX_SIZE / 1024 / 1024))MB threshold"
          fi

  # ============================================
  # JOB: Security Scanning
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.should_run_tests == 'true'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: true

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy Scan Results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # JOB: Merge Coverage Reports
  # ============================================
  merge-coverage:
    name: 📊 Merge Coverage Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-unit]
    if: always() && needs.test-unit.result == 'success'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: coverage/

      - name: Merge Coverage Reports
        run: |
          echo "Coverage reports merged successfully"
          # Add merging logic if needed based on your coverage tool

      - name: Upload Merged Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-merged
          path: coverage/
          retention-days: 30

  # ============================================
  # JOB: Summary & Status Check
  # ============================================
  quality-summary:
    name: ✅ Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test-unit, test-e2e, build, security]
    if: always()
    
    steps:
      - name: Generate Quality Summary
        run: |
          echo "## 🎯 CI Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.test-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.test-unit.result }}" == "failure" || "${{ needs.test-e2e.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Quality gates failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All quality gates passed!" >> $GITHUB_STEP_SUMMARY
          fi
