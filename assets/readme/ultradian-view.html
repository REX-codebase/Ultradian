<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultradian — Fluid SwiftUI Focus & Rhythm Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #0c0a09;
      color: #f5f2ec;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Ultradian Experience">
    <defs>
      <!-- Ambient Glow & Background Wash -->
      <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#1c1917" stop-opacity="0.85"/>
        <stop offset="60%" stop-color="#0c0a09" stop-opacity="0.98"/>
        <stop offset="100%" stop-color="#080706" stop-opacity="1"/>
      </radialGradient>

      <!-- Liquid Gold Radial Core -->
      <radialGradient id="gold-halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
        <stop offset="50%" stop-color="#b45309" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#0c0a09" stop-opacity="0"/>
      </radialGradient>

      <!-- Glass Sheen Linear Gradients -->
      <linearGradient id="glass-border" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
      </linearGradient>

      <linearGradient id="glass-surface" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#262320" stop-opacity="0.80"/>
        <stop offset="100%" stop-color="#141210" stop-opacity="0.90"/>
      </linearGradient>

      <linearGradient id="gold-cta" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>

      <linearGradient id="cadence-area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
      </linearGradient>

      <!-- Card Filter Shadows -->
      <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      </filter>

      <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- Base Canvas -->
    <rect width="1280" height="720" fill="url(#bg-glow)"/>
    <circle cx="640" cy="360" r="320" fill="url(#gold-halo)"/>

    <!-- ============================================================== -->
    <!-- GLOBAL NAVBAR (Liquid Glass Capsule)                           -->
    <!-- ============================================================== -->
    <g id="navbar" transform="translate(420, 24)" filter="url(#glass-shadow)">
      <!-- Pill Container -->
      <rect width="440" height="52" rx="26" fill="url(#glass-surface)" stroke="url(#glass-border)" stroke-width="1"/>
      
      <!-- Sliding Tab Capsule Highlight -->
      <rect id="nav-pill" x="6" y="6" width="138" height="40" rx="20" fill="#f5f2ec" filter="url(#glass-shadow)"/>

      <!-- Tab Buttons -->
      <text id="tab-focus" x="75" y="31" text-anchor="middle" font-size="13" font-weight="600" fill="#141210" letter-spacing="-0.1">Focus</text>
      <text id="tab-rhythm" x="220" y="31" text-anchor="middle" font-size="13" font-weight="500" fill="#a8a29e" letter-spacing="-0.1">Rhythm</text>
      <text id="tab-league" x="365" y="31" text-anchor="middle" font-size="13" font-weight="500" fill="#a8a29e" letter-spacing="-0.1">League</text>
    </g>

    <!-- Top Left Brand Badge -->
    <g id="brand" transform="translate(56, 32)">
      <circle cx="16" cy="16" r="16" fill="#1c1917" stroke="url(#glass-border)" stroke-width="1"/>
      <path d="M10 16c2-4 4-4 6 0s4 4 6 0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="21" font-family="'Instrument Serif', serif" font-size="24" fill="#f5f2ec" letter-spacing="-0.4">Ultradian</text>
    </g>

    <!-- Top Right Controls Dock -->
    <g id="header-right" transform="translate(1120, 28)">

        <path d="M2 7v4h3l4 3.5V3.5L5 7H2z"/>
        <path d="M12 6a3 3 0 0 1 0 6"/>
      </g>
      <!-- Settings Gear -->
      <g transform="translate(64, 13)" fill="none" stroke="#a8a29e" stroke-width="1.8" stroke-linecap="round">
        <circle cx="8" cy="8" r="3"/>
        <path d="M8 2v2M8 12v2M2 8h2M12 8h2"/>
      </g>
    </g>

    <!-- ============================================================== -->
    <!-- SCENE 1: FOCUS COMMAND CENTER (0.0s – 4.5s)                     -->
    <!-- ============================================================== -->
    <g id="scene-focus" opacity="1">
      <!-- 1. Task Objective Input Bar -->
      <g id="task-card" transform="translate(400, 106)" filter="url(#glass-shadow)">
        <rect width="480" height="48" rx="24" fill="url(#glass-surface)" stroke="url(#glass-border)" stroke-width="1"/>
        <text id="task-text" x="240" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#f5f2ec" letter-spacing="-0.2">Ship Biological Rhythm Engine</text>

      </g>

      <!-- 2. Segmented Category Pill Track -->
      <g id="categories" transform="translate(340, 172)">

        <rect id="cat-pill" x="4" y="4" width="96" height="32" rx="16" fill="#f59e0b" filter="url(#glow-gold)"/>
        <!-- Categories -->
        <text x="52" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#141210">Coding</text>
        <text x="148" y="24" text-anchor="middle" font-size="12" font-weight="500" fill="#a8a29e">Writing</text>
        <text x="244" y="24" text-anchor="middle" font-size="12" font-weight="500" fill="#a8a29e">Design</text>
        <text x="344" y="24" text-anchor="middle" font-size="12" font-weight="500" fill="#a8a29e">Research</text>

        <circle cx="0" cy="0" r="128" fill="none" stroke="#262320" stroke-width="3"/>
        <circle id="dial-progress" cx="0" cy="0" r="128" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="804.2" stroke-dashoffset="804.2" transform="rotate(-90)" filter="url(#glow-gold)"/>

        <circle cx="0" cy="0" r="114" fill="#141210" stroke="url(#glass-border)" stroke-width="1"/>

        <!-- Phase Badge -->

      </g>

      <!-- 4. Dynamic Island Master Pill CTA -->

        <rect id="cta-pill" width="320" height="54" rx="27" fill="url(#gold-cta)" stroke="#fbbf24" stroke-width="1.2" filter="url(#glow-gold)"/>

      </g>

      <!-- 5. Floating Control Center Dock -->
      <g id="control-dock" transform="translate(500, 608)" filter="url(#glass-shadow)">

          <path d="M3 3h4v4M13 3h4v4M17 13v4h-4M7 17H3v-4"/>

    </g>

          <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#a8a29e" letter-spacing="1">FOCUS WAVES</text>

        </g>

        <!-- Card 4: Rhythm SQI -->
        <g transform="translate(708, 0)" filter="url(#glass-shadow)">
          <rect width="210" height="92" rx="20" fill="url(#glass-surface)" stroke="url(#glass-border)" stroke-width="1"/>
          <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#a8a29e" letter-spacing="1">RHYTHM SQI</text>

      <!-- Weekly Rhythm Cadence Area Chart Card -->
      <g transform="translate(180, 212)" filter="url(#glass-shadow)">
        <rect width="920" height="236" rx="24" fill="url(#glass-surface)" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="28" y="38" font-family="'Instrument Serif', serif" font-size="20" fill="#f5f2ec">Weekly Rhythm Cadence</text>
        <text x="28" y="56" font-size="11" fill="#78716c">Focus minutes distribution across the rolling 7-day cycle</text>
        <rect x="790" y="22" width="102" height="24" rx="12" fill="#262320" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="841" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#f59e0b" letter-spacing="1.2">LIVE CADENCE</text>

        <!-- Waveform Area Chart -->

        <!-- Day Ticks -->
        <g transform="translate(50, 218)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#78716c">
          <text x="10">Mon</text>
          <text x="140">Tue</text>
          <text x="280">Wed (Zenith 160m)</text>

          <text x="580">Fri</text>
          <text x="700">Sat</text>

      <!-- Hypothesis Experiment Card -->
      <g transform="translate(180, 468)" filter="url(#glass-shadow)">
        <rect width="920" height="152" rx="24" fill="url(#glass-surface)" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="28" y="34" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a8a29e" letter-spacing="1.5">NEXT HYPOTHESIS EXPERIMENT</text>
        <rect x="740" y="20" width="152" height="24" rx="12" fill="#262320" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="816" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f5f2ec">90m focus / 20m rest</text>

        <text x="28" y="70" font-family="'Instrument Serif', serif" font-size="22" fill="#f5f2ec">Extend Afternoon Immersion Wave</text>

        <!-- CTA Pill -->
        <rect x="28" y="110" width="220" height="32" rx="16" fill="#f5f2ec"/>
        <text x="138" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#141210">Apply Experiment Durations →</text>
      </g>
    </g>

    <!-- ============================================================== -->

  </svg>

  <script>
    const $ = (id) => document.getElementById(id);

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function span(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function springP(t, a, b) {
      const p = span(t, a, b);
      return easeOutCubic(p);
    }
    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(total) {
      const s = Math.max(0, total);
      return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
    }

    window.renderAt = function renderAt(t) {
      // -------------------------------------------------------------
      // Scene Timeline Transitions:
      // 0.0s - 4.2s : Scene 1 (Focus)
      // 4.2s - 7.2s : Scene 2 (Rhythm)
      // 7.2s - 10.0s: Scene 3 (League)
      // -------------------------------------------------------------

      const inFocus = t < 4.2;
      const inRhythm = t >= 4.2 && t < 7.2;
      const inLeague = t >= 7.2;

      // 1. Sliding Navbar Pill
      let pillX = 6;
      let tabFocusColor = "#141210";
      let tabRhythmColor = "#a8a29e";
      let tabLeagueColor = "#a8a29e";

      if (t < 4.2) {
        pillX = 6;
        tabFocusColor = "#141210";
        tabRhythmColor = "#a8a29e";
        tabLeagueColor = "#a8a29e";
      } else if (t < 7.2) {
        const p = easeInOutQuad(span(t, 4.2, 4.6));
        pillX = 6 + p * 145;
        tabFocusColor = p > 0.5 ? "#a8a29e" : "#141210";
        tabRhythmColor = p > 0.5 ? "#141210" : "#a8a29e";
        tabLeagueColor = "#a8a29e";
      } else {
        const p = easeInOutQuad(span(t, 7.2, 7.6));
        pillX = 151 + p * 140;
        tabFocusColor = "#a8a29e";
        tabRhythmColor = p > 0.5 ? "#a8a29e" : "#141210";
        tabLeagueColor = p > 0.5 ? "#141210" : "#a8a29e";
      }

      $("nav-pill").setAttribute("x", String(pillX));
      $("tab-focus").setAttribute("fill", tabFocusColor);
      $("tab-rhythm").setAttribute("fill", tabRhythmColor);
      $("tab-league").setAttribute("fill", tabLeagueColor);

      // 2. Scene Opacities & Cross-fades
      let oFocus = 0, oRhythm = 0, oLeague = 0;
      let yFocus = 0, yRhythm = 16, yLeague = 16;

      if (t < 4.0) {
        oFocus = 1;
        yFocus = 0;
      } else if (t < 4.5) {
        const p = span(t, 4.0, 4.5);
        oFocus = 1 - p;
        yFocus = -p * 20;
        oRhythm = p;
        yRhythm = (1 - p) * 20;
      } else if (t < 7.0) {
        oRhythm = 1;
        yRhythm = 0;
      } else if (t < 7.5) {
        const p = span(t, 7.0, 7.5);
        oRhythm = 1 - p;
        yRhythm = -p * 20;
        oLeague = p;
        yLeague = (1 - p) * 20;
      } else {
        oLeague = 1;
        yLeague = 0;
      }

      $("scene-focus").setAttribute("opacity", String(oFocus));
      $("scene-focus").setAttribute("transform", `translate(0 ${yFocus})`);

      $("scene-rhythm").setAttribute("opacity", String(oRhythm));
      $("scene-rhythm").setAttribute("transform", `translate(0 ${yRhythm})`);

      $("scene-league").setAttribute("opacity", String(oLeague));
      $("scene-league").setAttribute("transform", `translate(0 ${yLeague})`);

      // 3. Scene 1 Micro-Interactions (Focus)
      if (t < 4.5) {
        const isRunning = t >= 1.8;
        const sessionTime = Math.max(0, t - 1.8);
        const secondsLeft = 90 * 60 - Math.floor(sessionTime * 30); // Accelerated clock display
        $("clock-digits").textContent = fmt(secondsLeft);

        // Circular Dial Progress (804.2 circumference)
        const progFraction = isRunning ? Math.min(1, sessionTime * 0.12) : 0;
        const offset = 804.2 * (1 - progFraction);
        $("dial-progress").setAttribute("stroke-dashoffset", String(offset));

        // Pulsing Live Badge
        if (isRunning) {
          $("cta-play").setAttribute("opacity", "0");
          $("cta-pause").setAttribute("opacity", "1");
          $("cta-text").textContent = "Pause Focus Wave";
          const pulse = 0.8 + 0.2 * Math.sin(sessionTime * 5);
          $("live-badge").setAttribute("opacity", String(pulse));
        } else {
          $("cta-play").setAttribute("opacity", "1");
          $("cta-pause").setAttribute("opacity", "0");
          $("cta-text").textContent = "Begin 90m Wave";
          $("live-badge").setAttribute("opacity", "0.6");
        }
      }
    };

    window.__ready = document.fonts.ready.then(() => {
      document.documentElement.dataset.fonts = "ready";
    });

    const params = new URLSearchParams(location.search);
    if (params.has("t")) {
      window.renderAt(Number(params.get("t")) || 0);
    } else if (!params.has("still")) {
      let start = null;
      const loop = (now) => {
        if (start == null) start = now;
        const t = ((now - start) / 1000) % 10;
        window.renderAt(t);
        requestAnimationFrame(loop);
      };
      document.fonts.ready.then(() => requestAnimationFrame(loop));
    } else {
      document.fonts.ready.then(() => window.renderAt(0));
    }
  </script>
</body>
</html>
